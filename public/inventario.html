
 <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Inventario</title>
  <style>
    body { font-family: Arial; max-width: 900px; margin: 20px auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 10px; border-bottom: 1px solid #ddd; }
    th { background: #4CAF50; color: white; }
    tr:nth-child(even) { background: #f9f9f9; }
    tr:hover { background: #f1f1f1; }#infoInventario {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
  font-size: 16px;
}
button {
            margin-top: 20px; padding: 10px 20px;
            background: #4CAF50; color: white;
            border: none; border-radius: 4px;
            cursor: pointer;
        }
button:hover { background: #45a049; }
#paginacion {
  margin-top: 20px;
  text-align: center;
}

#paginacion button {
  padding: 8px 15px;
  margin: 0 5px;
  background: #4CAF50;
  color: white;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

#paginacion button:hover {
  background: #45a049;
}

#filtros {
  display: flex;
  gap: 20px;
  margin: 15px 0;
}

#filtros select {
  padding: 8px;
}

    /* Input de unidad */
    input[type="text"] {
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
      width: 200px;
      transition: 0.2s;
    }

    input[type="text"]:focus {
      border-color: #4CAF50;
      box-shadow: 0 0 4px rgba(76,175,80,0.4);
      outline: none;
    } 
    
    input {
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
      width: 220px;
      transition: 0.2s;
    }


  </style>
</head>

<body>

<h2>Inventario</h2>
Operario: <strong id="operarioLabel"></strong>

<br><br>

<label>Empresa</label>
<select id="empresa">
  <option value="Global">Global</option>
  <option value="Titsa">Titsa</option>
</select>
<input 
  type="text" 
  id="buscador" 
  placeholder="Buscar máquina..."
  style="padding: 8px; width: 250px; margin-left: 10px;"
></input>

<div id="filtros">
  <label>Ubicación</label>
  <select id="filtroUbicacion">
    <option value="">Todas</option>
  </select>

  <label>Marca</label>
  <select id="filtroMarca">
    <option value="">Todas</option>
  </select>

  <label id="labelLote" style="display:none;">Lote</label>
  <select id="filtroLote" style="display:none;">
    <option value="">Todos</option>
    <option value="3">Lote 3</option>
    <option value="4">Lote 4</option>
  </select>


</div>
<button onclick="descargarPDF()">Descargar PDF</button>



<div id="tablaContainer"></div>
<div id="paginacion"></div>

  <script>
    // Cargar usuario y bloquear empresa si no es admin
fetch("/api/me")
  .then(r => r.json())
  .then(user => {
    document.getElementById("operarioLabel").innerText = user.username;

    const selEmpresa = document.getElementById("empresa");

    if (user.rol !== "admin") {
      selEmpresa.value = user.empresa;
      selEmpresa.disabled = true;
    }

    // 👇 AQUI: mostrar/ocultar lote al cargar
    if (selEmpresa.value === "Titsa") {
      document.getElementById("labelLote").style.display = "block";
      document.getElementById("filtroLote").style.display = "block";
    } else {
      document.getElementById("labelLote").style.display = "none";
      document.getElementById("filtroLote").style.display = "none";
      document.getElementById("filtroLote").value = "";
    }

    cargarFiltros(selEmpresa.value);
    cargarInventario(selEmpresa.value, 1);

    selEmpresa.addEventListener("change", () => {
      const empresa = selEmpresa.value;

      if (empresa === "Titsa") {
        document.getElementById("labelLote").style.display = "block";
        document.getElementById("filtroLote").style.display = "block";
      } else {
        document.getElementById("labelLote").style.display = "none";
        document.getElementById("filtroLote").style.display = "none";
        document.getElementById("filtroLote").value = "";
      }

      cargarFiltros(empresa);
      cargarInventario(empresa, 1);
    });
  });


async function cargarFiltros(empresa) {
  // Ubicaciones
  const r1 = await fetch(`/api/inventario/ubicaciones?empresa=${empresa}`);
  const ubicaciones = await r1.json();

  const selU = document.getElementById("filtroUbicacion");
  selU.innerHTML = `<option value="">Todas</option>`;
  ubicaciones.forEach(u => {
    selU.innerHTML += `<option value="${u.ubicacion}">${u.ubicacion}</option>`;
  });

  // Marcas
  const r2 = await fetch(`/api/inventario/marcas?empresa=${empresa}`);
  const marcas = await r2.json();

  const selM = document.getElementById("filtroMarca");
  selM.innerHTML = `<option value="">Todas</option>`;
  marcas.forEach(m => {
    selM.innerHTML += `<option value="${m.marca}">${m.marca}</option>`;
  });
}




async function cargarInventario(empresa, pagina) {
  const ubicacion = document.getElementById("filtroUbicacion").value;
  const marca = document.getElementById("filtroMarca").value;
  const busqueda = document.getElementById("buscador").value.trim();

  const lote = document.getElementById("filtroLote").value;

  const res = await fetch(
    `/api/inventario?empresa=${empresa}&page=${pagina}&limit=20&ubicacion=${encodeURIComponent(ubicacion)}&marca=${encodeURIComponent(marca)}&busqueda=${encodeURIComponent(busqueda)}&lote=${encodeURIComponent(lote)}`
  );


  const json = await res.json();

  if (json.datos.length === 0) {
    document.getElementById("tablaContainer").innerHTML =
      "<p>No hay resultados para ese filtrado.</p>";
    document.getElementById("paginacion").innerHTML = "";
    return;
  }

  mostrarTabla(json.datos);
  mostrarPaginacion(json.total, json.page, json.limit, empresa);
}

document.getElementById("buscador").addEventListener("input", () => {
  const empresa = document.getElementById("empresa").value;
  cargarInventario(empresa, 1);
});



function mostrarTabla(datos) {
  const cont = document.getElementById("tablaContainer");

  if (datos.length === 0) {
    cont.innerHTML = "<p>No hay registros.</p>";
    return;
  }

  let html = "<table><tr>";
  html += "<th>ID</th><th>Máquina</th><th>Ubicación</th><th>Marca</th><th>Modelo</th><th>Num. Serie</th>";
  html += "</tr>";

  datos.forEach(row => {
    html += `
      <tr>
        <td>${row.id_maquina}</td>
        <td>${row.maquina}</td>
        <td>${row.ubicacion}</td>
        <td>${row.marca || ""}</td>
        <td>${row.modelo || ""}</td>
        <td>${row.num_serie || ""}</td>
      </tr>
    `;
  });

  html += "</table>";
  cont.innerHTML = html;
}

function mostrarPaginacion(total, page, limit, empresa) {
  const totalPaginas = Math.ceil(total / limit);
  const cont = document.getElementById("paginacion");

  let html = "<div class='paginacion'>";

  if (page > 1) {
    html += `<button onclick="cargarInventario('${empresa}', ${page - 1})">Anterior</button>`;
  }

  html += `<span>Página ${page} de ${totalPaginas}</span>`;

  if (page < totalPaginas) {
    html += `<button onclick="cargarInventario('${empresa}', ${page + 1})">Siguiente</button>`;
  }

  html += "</div>";

  cont.innerHTML = html;
}

async function descargarPDF() {
  const empresa = document.getElementById("empresa").value;
  const ubicacion = document.getElementById("filtroUbicacion").value;
  const marca = document.getElementById("filtroMarca").value;
  const busqueda = document.getElementById("buscador").value.trim();
  const lote = document.getElementById("filtroLote").value;

 // form.append("lote", lote);

  const form = new FormData();
  form.append("empresa", empresa);
  form.append("ubicacion", ubicacion);
  form.append("marca", marca);
  form.append("busqueda", busqueda);
  form.append("lote", lote);


  const res = await fetch("/api/pdfInventario", {
    method: "POST",
    body: form
  });

  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  //const empresa = document.getElementById("empresa").value;
  const fecha = new Date().toISOString().slice(0,10); // YYYY-MM-DD

  a.href = url;
  a.download = `Inventario_${empresa}_${fecha}.pdf`;
  a.click();
}


document.getElementById("filtroUbicacion").addEventListener("change", () => {
  const empresa = document.getElementById("empresa").value;
  cargarInventario(empresa, 1);
});

document.getElementById("filtroMarca").addEventListener("change", () => {
  const empresa = document.getElementById("empresa").value;
  cargarInventario(empresa, 1);
});

document.getElementById("empresa").addEventListener("change", () => {
  const empresa = document.getElementById("empresa").value;

  if (empresa === "Titsa") {
    document.getElementById("labelLote").style.display = "block";
    document.getElementById("filtroLote").style.display = "block";
  } else {
    document.getElementById("labelLote").style.display = "none";
    document.getElementById("filtroLote").style.display = "none";
    document.getElementById("filtroLote").value = "";
  }

  cargarFiltros(empresa);
  cargarInventario(empresa, 1);
});

document.getElementById("filtroLote").addEventListener("change", () => {
  const empresa = document.getElementById("empresa").value;
  cargarInventario(empresa, 1);
});



</script>

</body>
</html>
