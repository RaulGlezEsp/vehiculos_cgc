<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Enviar Informes del Día</title>
<style>
body { font-family: Arial; max-width: 700px; margin: 20px auto; }
label { font-weight: bold; display: block; margin-top: 10px; }
input, select, button {
    width: 100%; padding: 10px; margin-top: 10px;
    border: 1px solid #ccc; border-radius: 4px;
}
button {
    background: #4CAF50; color: white; cursor: pointer;
}
button:hover { background: #45a049; }
#lista { margin-top: 20px; }
        #obsContainer textarea {
          resize: vertical;
        }

        #obsContainer {
          display: flex;
          flex-direction: column;
          align-items: center;   /* centra horizontalmente */
        }

        
        #observaciones {
          width: 360px;
          font-family: Helvetica, Arial, sans-serif;
          font-size: 12px;
          line-height: 1.3;
          white-space: pre-wrap;   /* permite saltos naturales */
          overflow-wrap: break-word;
        }


        #contador {
          font-size: 12px;
          margin-top: 5px;
        }

        textarea {
          width: auto; padding: 8px; margin-top: 5px;
          border: 1px solid #ccc; border-radius: 4px;
        }
</style>
</head>
<body>

<h2>Enviar Informes del Día</h2>
Operario: <strong id="operarioLabel"></strong>
<label>Empresa</label>
<select id="empresa">
    <option value="Global">Global</option>
    <option value="Titsa">Titsa</option>
</select>

<label id="labelSubir">Subir PDFs individuales</label>
<input type="file" id="pdfs" accept="application/pdf" multiple>
<div id="titsaContainer" style="display:none; margin-top:20px;">
    <button id="btnCargarTitsa">Cargar registros</button>
    <select id="tipoInforme">
      <option value="diario">Diario</option>
      <option value="mensual">Mensual</option>
    </select>

    <!-- 🔥 Selector de lote (oculto por defecto) -->
    <div id="loteContainer" style="display:none; margin-top:10px;">
      <label for="lote">Lote:</label>
      <select id="lote">
        <option value="3">Lote 3</option>
        <option value="4">Lote 4</option>
      </select>
    </div>



    <div class="tabla-scroll" style="margin-top:15px;">
        <table border="1" id="tablaTitsa"></table>
    </div>
    <div id="obsContainer"></div>

</div>


<button id="btnSubir">Subir PDFs</button>

<h3 id="cargados">PDFs cargados:</h3>
<ul id="lista"></ul>

<button id="btnEnviar">Enviar todos los informes</button>
<button type="button" onclick="location.href='/formulario.html'">Añadir registros</button>
<button onclick="location.href='/prioridades.html'">Ver prioridades</button>
<button onclick="location.href='/historial.html'">Comprobar historial</button>
<script>
document.addEventListener("DOMContentLoaded", () => {
    // TODO TU SCRIPT AQUÍ


fetch("/api/me")
  .then(r => {
    if (!r.ok) {
      location.href = "/index.html";
      return;
    }
    return r.json();
  })
  .then(user => {
    if (!user || !user.username) {
      location.href = "/index.html";
      return;
    }

    document.getElementById("operarioLabel").innerText = user.username;

    const selEmpresa = document.getElementById("empresa");

    if (selEmpresa) {
      if (user.rol !== "admin") {
        selEmpresa.value = user.empresa;
        selEmpresa.disabled = true;
      }
    }

    const empresaEfectiva = user.rol === "admin"
      ? selEmpresa?.value
      : user.empresa;

    if (empresaEfectiva && typeof cargarMaquinas === "function") {
      cargarMaquinas(empresaEfectiva);
    }
      activarModoEmpresa(selEmpresa.value);
      // IMPORTANTE: activar cambio dinámico
      selEmpresa.addEventListener("change", () => {
        activarModoEmpresa(selEmpresa.value);
      });

      // CONTROL DEL SELECTOR DIARIO/MENSUAL SOLO PARA TITSA
      const selTipoInforme = document.getElementById("tipoInforme");

      if (selTipoInforme) {
  
        // Si NO es admin → siempre diario y bloqueado
        if (user.rol !== "admin") {
          selTipoInforme.value = "diario";
          selTipoInforme.disabled = true;
        }

        // Si es admin → solo permitir mensual cuando empresa = Titsa
        if (user.rol === "admin") {
          if (empresaEfectiva === "Titsa") {
            selTipoInforme.disabled = false;
          } else {
            selTipoInforme.value = "diario";
            selTipoInforme.disabled = true;
          }
        }

        // Cuando el admin cambie empresa, actualizar selector
        selEmpresa.addEventListener("change", () => {
          const nuevaEmpresa = selEmpresa.value;

          if (user.rol === "admin") {
            if (nuevaEmpresa === "Titsa") {
              selTipoInforme.disabled = false;
            } else {
              selTipoInforme.value = "diario";
              selTipoInforme.disabled = true;
            }
          }
        });
      }
  });

const btnSubir = document.getElementById("btnSubir");
document.getElementById("btnSubir").onclick = subir;
document.getElementById("btnEnviar").onclick = enviar;

const btnEnviar = document.getElementById("btnEnviar");

async function enviarInformeDiarioTitsa() {
  const tipo = document.getElementById("tipoInforme").value;
  const observaciones = document.getElementById("observaciones")?.value || "";

  let url = `/api/enviarInformeDiarioTitsa?tipo=${tipo}`;

  if (tipo === "mensual") {
    const lote = document.getElementById("lote").value;
    url += `&lote=${lote}`;
  }

  const r = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ observaciones })
  });


  const blob = await r.blob();
  const url2 = window.URL.createObjectURL(blob);
  const filename = r.headers.get("X-Filename") || "informe_titsa.pdf";

  const a = document.createElement("a");
  a.href = url2;
  a.download = filename;
  a.click();
}


function activarControlObservaciones() {
  const observaciones = document.getElementById("observaciones");
  const contador = document.getElementById("contador");
  const aviso = document.getElementById("obsAviso");
  const label = document.getElementById("obsLabel");

  const maxCharsPorLinea = 50;
  const maxLineas = 12;

  observaciones.addEventListener("input", () => {
    let texto = observaciones.value.replace(/\r\n/g, "\n");
    let lineas = texto.split("\n");

    let nuevas = [];

    // Limitar caracteres por línea
    for (let linea of lineas) {
      if (linea.length > maxCharsPorLinea) {
        linea = linea.slice(0, maxCharsPorLinea);
      }
      nuevas.push(linea);
    }

    // Limitar número de líneas
    if (nuevas.length > maxLineas) {
      nuevas = nuevas.slice(0, maxLineas);
    }

    // Actualizar textarea
    observaciones.value = nuevas.join("\n");

    // Avisos visuales
    if (nuevas.length >= maxLineas) {
      aviso.textContent = "Límite de líneas alcanzado.";
      aviso.style.display = "block";
      observaciones.style.border = "2px solid red";
      label.style.color = "red";
      contador.style.color = "red";
    } else {
      aviso.style.display = "none";
      observaciones.style.border = "";
      label.style.color = "black";
      contador.style.color = "black";
    }

    // Actualizar contador
    contador.textContent = `Líneas: ${nuevas.length}/${maxLineas}`;
  });
}

function activarModoEmpresa(empresa) {
  const inputPDF = document.getElementById("pdfs");
  const lista = document.getElementById("lista");
  const btnSubir = document.getElementById("btnSubir");
  const btnEnviar = document.getElementById("btnEnviar");
  const labelSubir = document.getElementById("labelSubir");
  const cargados = document.getElementById("cargados");
  const titsaContainer = document.getElementById("titsaContainer");
  const obsContainer = document.getElementById("obsContainer");

  if (empresa === "Titsa") {
    // Ocultar modo Global
    inputPDF.style.display = "none";
    lista.style.display = "none";
    btnSubir.style.display = "none";
    labelSubir.style.display = "none";
    cargados.style.display = "none";

    // Mostrar modo TITSA
    titsaContainer.style.display = "block";
    btnEnviar.textContent = "Generar y enviar informe diario";
    btnEnviar.onclick = enviarInformeDiarioTitsa;

    // 🔥 Crear cuadro de observaciones SOLO en modo TITSA
    obsContainer.innerHTML = `
      <label for="observaciones" id="obsLabel">Observaciones:</label>
      <textarea id="observaciones" rows="6"></textarea>

      <div id="obsAviso" style="
        color: red;
        font-size: 12px;
        margin-top: 4px;
        display: none;
      "></div>

      <div id="contador" style="font-size:12px; margin-top:5px; color:black;">
        Líneas: 0/12
      </div>
    `;

    activarControlObservaciones(); // 👈 activar lógica del textarea

  } else {
    // Modo Global
    inputPDF.style.display = "";
    lista.style.display = "";
    btnSubir.style.display = "";
    titsaContainer.style.display = "none";
    btnEnviar.textContent = "Enviar todos los informes";
    btnEnviar.onclick = enviar;

    // Ocultar cuadro de observaciones
    obsContainer.innerHTML = "";
  }
}

document.getElementById("btnCargarTitsa").onclick = cargarTitsa;

async function cargarTitsa() {
  const tipo = document.getElementById("tipoInforme").value;

  let url = `/api/diarioTitsa?tipo=${tipo}`;

  if (tipo === "mensual") {
    const lote = document.getElementById("lote").value;
    url += `&lote=${lote}`;
  }

  const r = await fetch(url);

  const json = await r.json();
  const rows = json.datos;


  console.log("Total:", rows.total);
  console.log("Datos:", rows.datos);
  

  const t = document.getElementById("tablaTitsa");

  if(tipo === "mensual"){
        t.innerHTML = `
    <tr>
      <th>ID Máquina</th>
      <th>Máquina</th>
      <th>Ubicación</th>
      <th>Fecha</th>
      <th>Operario</th>
      <th>Pendiente presupuesto</th>
      <th>Pendiente recambio</th>
    
    </tr>
  `;

  rows.forEach(x => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${x.id_maquina}</td>
      <td>${x.maquina}</td>
      <td>${x.ubicacion}</td>
      <td>${x.fecha_revision.split("T")[0]}</td>
      <td>${x.operario}</td>
      <td>${x.pendiente_presupuesto}</td>
      <td>${x.pendiente_recambio}</td>
    `;
    t.appendChild(tr);
  });


  }else{
      t.innerHTML = `
      <tr>
        <th>ID Máquina</th>
        <th>Máquina</th>
        <th>Ubicación</th>
        <th>Fecha</th>
        <th>Pendiente presupuesto</th>
        <th>Pendiente recambio</th>
      </tr>
    `;

    rows.forEach(x => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${x.id_maquina}</td>
        <td>${x.maquina}</td>
        <td>${x.ubicacion}</td>
        <td>${x.fecha_revision.split("T")[0]}</td>
        <td>${x.pendiente_presupuesto}</td>
        <td>${x.pendiente_recambio}</td>
      `;
      t.appendChild(tr);
    });

  }


  

}



const LIMITE_PDFS = 20;

function calcularTamanoArchivos(files) {
    let total = 0;
    for (const f of files) total += f.size;
    return total;
}

async function subir() {
    const files = document.getElementById("pdfs").files;
    if (!files.length) return alert("Selecciona al menos un PDF");

    // Comprobar cuántos PDFs ya hay cargados
    const listaActual = document.querySelectorAll("#lista li").length;

    // Si ya hay 20 → no permitir más
    if (listaActual >= LIMITE_PDFS) {
        alert("Ya has subido el máximo de 20 informes.");
        return;
    }

    // Si la suma de actuales + nuevos supera 20 → bloquear
    if (listaActual + files.length > LIMITE_PDFS) {
        alert(`Solo puedes subir ${LIMITE_PDFS - listaActual} PDFs más.`);
        return;
    }

    const form = new FormData();
    for (const f of files) form.append("pdfs", f);

    const r = await fetch("/api/subirInforme", {
        method: "POST",
        body: form
    });

    const data = await r.json();

    if (!data.ok) {
        alert(data.msg || "Error subiendo archivos");
        return;
    }

    actualizarLista(data.lista);
}


async function enviar() {
    const empresa = document.getElementById("empresa").value;

    const r = await fetch("/api/enviarInformes", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ empresa })
    });

    const data = await r.json();
    alert(data.msg);
    actualizarLista([]);
}

//document.getElementById("btnGenerarTitsa").onclick = enviarInformeDiarioTitsa;


function actualizarLista(lista) {
    const ul = document.getElementById("lista");
    ul.innerHTML = "";

    lista.forEach((n, i) => {
        const li = document.createElement("li");
        li.textContent = `${i+1}. ${n}`;
        ul.appendChild(li);
    });

    // Si ya hay 20 → desactivar input
    const input = document.getElementById("pdfs");
    if (lista.length >= LIMITE_PDFS) {
        input.disabled = true;
    } else {
        input.disabled = false;
    }
}
document.getElementById("tipoInforme").addEventListener("change", () => {
  const tipo = document.getElementById("tipoInforme").value;
  const loteContainer = document.getElementById("loteContainer");

  if (tipo === "mensual") {
    loteContainer.style.display = "block";
  } else {
    loteContainer.style.display = "none";
  }
});

});

</script>
