<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Máquina</title>
    <style>
        body { font-family: Arial; max-width: 700px; margin: 20px auto; }
        label { font-weight: bold; display: block; margin-top: 10px; }
        input, textarea, select {
            width: 100%; padding: 8px; margin-top: 5px;
            border: 1px solid #ccc; border-radius: 4px;
        }
        button {
            margin-top: 20px; padding: 10px 20px;
            background: #4CAF50; color: white;
            border: none; border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #45a049; }
        form {
            max-width: 600px;
            margin: auto;
            padding: 15px;
        }

        form label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        form input,
        form select,
        form textarea {
            width: 100%;
            padding: 8px;
            font-size: 14px;
            box-sizing: border-box;
            margin-top: 4px;
        }

        form button {
            margin-top: 20px;
            padding: 12px;
            font-size: 16px;
            width: 100%;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        form button:hover {
            background-color: #45a049;
        }

        /* Responsive ajustes si hicieras columnas en el futuro */
        @media (max-width: 600px) {
            form {
                padding: 10px;
            }
        }

    </style>
</head>
<body>

<h2>Registrar vehículo</h2>
<p>Mantenimiento rutinario</p>

<form id="formVehiculo">  
    Operario: <strong id="operarioLabel"></strong>
    <br>
    
    <label>Numero orden</label>
    <input type="text" name="numero_orden" required>

    <label>Tipo vehiculo</label>
    <select name="tipo_vehiculo" id="tipo_vehiculo"> </select>  

    <label>Matricula</label>

    <div style="position:relative;">

      <input
          type="text"
          name="matricula"
          id="matricula"
          autocomplete="off"
          required>

      <div id="sugerenciasMatricula"
           style="
           border:1px solid #ccc;
           border-radius:4px;
           max-height:150px;
           overflow-y:auto;
           display:none;
           position:absolute;
           background:white;
           width:100%;
           top:100%;
           left:0;
           z-index:1000;">
      </div>

    </div>
    
    <label>Ubicación </label>
    <select id="ubicacion" name="ubicacion"></select>    

    <label>Indicativo</label>
    <input type="text" name="indicativo" required>

    <label>Marca</label>
    <input type="text" name="marca">

    <label>Modelo</label>
    <input type="text" name="modelo">

    <label>Kilometros </label>
    <input type="text" name="kilometros">

    <label>Litros cisternas</label>
    <input type="text" name="litros_cisternas">

    <label>Fecha revisión *</label>
    <input type="date" name="fecha_revision" required>

    <label>Próxima revisión *</label>
    <input type="date" name="proxima_revision" required>
    
    <label>Observaciones</label>
    <textarea name="Observaciones" id="observaciones" rows="4"></textarea>
    <div id="contador"></div>

    <label>Adjuntar PDF</label>
    <input type="file" name="Adjuntos" id="adjuntos" accept="application/pdf,image/*" multiple>

    <button type="submit">Registrar máquina</button>
    <button onclick="location.href='/prioridades.html'">Ver prioridades</button>
    <button type="button" onclick="location.href='/subida_informes.html'">Enviar informes del día</button>
    <button onclick="location.href='/historial.html'">Comprobar historial</button>
</form>
<script>
    document.addEventListener("DOMContentLoaded", () => {   
      cargarUbicaciones();
    });

    let listaMatriculas = [];

    async function cargarUbicaciones() {
        const r = await fetch(`/api/ubicaciones/`);
        const ubicaciones = await r.json();

        const sel = document.getElementById("ubicacion");
        sel.innerHTML = "";

        ubicaciones.forEach(u => {
          const opt = document.createElement("option");
          opt.value = u.ubicacion;
          opt.textContent = u.ubicacion;
          sel.appendChild(opt);
        });

        // Cargar máquinas de la primera ubicación automáticamente
        if (ubicaciones.length > 0) {
          cargarTiposPorUbicacion( ubicaciones[0].ubicacion);
        }
      
    }

    divSugMatricula.addEventListener("click", e => {

        if (
            e.target.classList.contains("mat-item")
        ) {

            matriculaInput.value =
                e.target.dataset.value;

            divSugMatricula.style.display =
                "none";

            matriculaInput.dispatchEvent(
                new Event("blur")
            );
        }
    });

    async function cargarTiposPorUbicacion(ubicacion) {
        const r = await fetch(`/api/tipos/${ubicacion}`);
        const tipos = await r.json();

        const sel = document.getElementById("tipo_vehiculo");
        sel.innerHTML = "";

        tipos.forEach(m => {
          const opt = document.createElement("option");
          opt.value = m.matricula;
          opt.textContent = `${m.tipo_vehiculo}`;
          //opt.textContent = `${m.matricula} - ${m.tipo_vehiculo}`;
          sel.appendChild(opt);
        });

        if (tipos.length > 0) {
          cargarMatriculasPorTipo( tipos[0].ubicacion);
        }  
    }

    async function cargarMatriculasPorTipo(tipo_vehiculo) {

        const r =
            await fetch(`/api/matriculas/${tipo_vehiculo}`);

        listaMatriculas =
            await r.json();
    }

    document.getElementById("ubicacion").addEventListener("change", () => {
        const ubicacion = document.getElementById("ubicacion").value;
        cargarTiposPorUbicacion(ubicacion);
    });

    document.getElementById("tipo_vehiculo").addEventListener("change", () => {
        const tipo_vehiculo = document.getElementById("tipo_vehiculo").value;
        cargarMatriculasPorTipo(tipo_vehiculo);
    });    

    document.getElementById('matricula').addEventListener("blur", async (e) => {
    const matricula = e.target.value.trim();

    if (!matricula) return;

    try {
        const res = await fetch(`/api/valores/${encodeURIComponent(matricula)}`);
        if (!res.ok) return;

        const datos = await res.json();

        // Rellenar automáticamente los campos
        document.querySelector('input[name="numero_orden"]').value = datos.numero_orden || "";
        document.querySelector('input[name="indicativo"]').value = datos.indicativo || "";
       // document.getElementById("ubicacion").value = datos.ubicacion || "";
        document.querySelector('input[name="marca"]').value = datos.marca || "";
        document.querySelector('input[name="modelo"]').value = datos.modelo || "";
        document.querySelector('input[name="kilometros"]').value = datos.kilometros || "";
        document.querySelector('input[name="litros_cisternas"]').value = datos.litros_cisternas || "";

    } catch (err) {
        console.error("Error obteniendo valores predefinidos:", err);
    }
});



function validarFechas() {
    const fechaRevisionInput = document.querySelector('input[name="fecha_revision"]');
    const proximaRevisionInput = document.querySelector('input[name="proxima_revision"]');


    if (!fechaRevisionInput.value) return;

    const mesesMinimos = 3;

    const fechaRevision = new Date(fechaRevisionInput.value);

    const fechaMinima = new Date(fechaRevision);
    fechaMinima.setMonth(fechaMinima.getMonth() + mesesMinimos);

    // 🔥 AUTORRELLENAR SOLO SI ESTÁ VACÍO
    if (!proximaRevisionInput.value) {
        proximaRevisionInput.value = fechaMinima.toISOString().slice(0,10);
        return; // ← IMPORTANTE: no validar todavía
    }

    // 🔥 VALIDAR SOLO SI EL USUARIO HA ESCRITO ALGO
    const proximaRevision = new Date(proximaRevisionInput.value);

    // Si la fecha es inválida, no validar
    if (isNaN(proximaRevision.getTime())) return;

    if (proximaRevision < fechaMinima) {
        alert(
            `La próxima revisión debe ser al menos ${mesesMinimos} mes(es) posterior.\n` +
            `Fecha mínima permitida: ${fechaMinima.toISOString().slice(0,10)}`
        );
        proximaRevisionInput.value = fechaMinima.toISOString().slice(0,10);
    }
}



    function sanitizeFilename(name) {
        return name.replace(/[^a-zA-Z0-9_\-]/g, "_"); // sustituye caracteres no válidos por "_"
    }

// Ejecutar validación al cambiar ambas fechas
document.querySelector('input[name="fecha_revision"]').addEventListener("change", validarFechas);
document.querySelector('input[name="proxima_revision"]').addEventListener("change", validarFechas);
    const observaciones = document.getElementById("observaciones");
    const contador = document.getElementById("contador");

    observaciones.addEventListener("input", () => {
        let lineas = observaciones.value.split("\n");

        // Limitar a 10 líneas
        if (lineas.length > 10) {
            lineas = lineas.slice(0, 10);
            observaciones.value = lineas.join("\n");
            alert("Solo se permiten 10 líneas como máximo.");
        }

        // Limitar cada línea a 54 caracteres
        lineas = lineas.map(linea => {
            if (linea.length > 54) {
                return linea.slice(0, 54);
            }
            return linea;
        });
        observaciones.value = lineas.join("\n");

        // Actualizar contador dinámico
        const totalLineas = lineas.length;
        const ultimaLinea = lineas[lineas.length - 1] || "";
        const caracteresUltima = ultimaLinea.length;

        contador.textContent = `Líneas: ${totalLineas}/10 | Caracteres en última línea: ${caracteresUltima}/54`;
    });    
fetch("/api/me")
  .then(r => r.json())
  .then(user => {
    document.getElementById("operarioLabel").innerText = user.username;
      cargarUbicaciones();
  });

document.getElementById("formVehiculo").addEventListener("submit", async (e) => {
    e.preventDefault();

    const formData = new FormData(e.target); // incluye texto + archivo

    // Enviar datos a /insert (solo texto)
    const res = await fetch("/api/insert", {
        method: "POST",
        body: formData // ⚠️ aquí ya no pones headers, fetch lo hace solo
    });

    if (res.ok) {
        const insertData = await res.json();
        alert("Registro insertado correctamente");
        
       

        const formDataPDF = new FormData();
        for (const [key, value] of formData.entries()) {
            formDataPDF.append(key, value);
        }
        


        const pdfRes = await fetch("/api/pdf", {
            method: "POST",
            body: formData
        });

        if (!pdfRes.ok) {
            alert("Error generando PDF");
            throw new Error("Error generando PDF");
        }

        const blob = await pdfRes.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        const year = new Date().getFullYear();
        a.href = url;
        a.download = `Informe_${year}`+`_${sanitizeFilename(formData.get("matricula"))}.pdf`;
        a.click();
        document.getElementById("formVehiculo").reset();
    } else {
        alert("Error insertando");
    }
});
</script>

</body>
</html>
