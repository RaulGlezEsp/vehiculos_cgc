<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Historial de Informes</title>
<style>
        body { font-family: Arial; max-width: 700px; margin: 20px auto; }
        label { font-weight: bold; display: block; margin-top: 10px; }
        input, textarea, select {
            width: 100%; padding: 8px; margin-top: 5px;
            border: 1px solid #ccc; border-radius: 4px;
        }
        button {
            margin-top: 20px; padding: 10px 20px;
            background: #4CAF50; color: white;
            border: none; border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #45a049; }
        form {
            max-width: 600px;
            margin: auto;
            padding: 15px;
        }

        form label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        form input,
        form select,
        form textarea {
            width: 100%;
            padding: 8px;
            font-size: 14px;
            box-sizing: border-box;
            margin-top: 4px;
        }

        form button {
            margin-top: 20px;
            padding: 12px;
            font-size: 16px;
            width: 100%;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        form button:hover {
            background-color: #45a049;
        }

        /* Responsive ajustes si hicieras columnas en el futuro */
        @media (max-width: 600px) {
            form {
                padding: 10px;
            }
        }

    </style>
</style>
</head>

<body>

<h2>Historial de Informes</h2>
Operario: <strong id="operarioLabel"></strong>
<br><br>

<div class="filtros">


  <label>Ubicación *</label>
  <select id="ubicacion" name="Ubicacion"></select>

  <label>Tipo vehiculo</label>
  <select name="tipo_vehiculo" id="tipo_vehiculo"> </select>  

  <label>Matricula</label>

    <div style="position:relative;">

      <input
          type="text"
          name="matricula"
          id="matricula"
          autocomplete="off"
          required>

      <div id="sugerenciasMatricula"
           style="
           border:1px solid #ccc;
           border-radius:4px;
           max-height:150px;
           overflow-y:auto;
           display:none;
           position:absolute;
           background:white;
           width:100%;
           top:100%;
           left:0;
           z-index:1000;">
      </div>

    </div>

  <label>Fecha inicio:</label>
  <input type="date" id="fechaInicio">

  <label>Fecha fin:</label>
  <input type="date" id="fechaFin">

  <label>Tipo:</label>
  <select id="tipo">
    <option value="">-- Todos --</option>
    <option value="mantenimiento rutinario">Mantenimiento rutinario</option>
    <option value="mantenimiento correctivo">Mantenimiento correctivo</option>
    <option value="solicitud averia">Solicitud de avería</option>
  </select>

  <button id="btnBuscar">Buscar</button>
  <button onclick="location.href='/formulario.html'">Volver</button>
</div>

<div id="resultados"></div>

<script>
// LOGIN
fetch("/api/me")
  .then(r => r.ok ? r.json() : location.href="/index.html")
  .then(user => {
    if (!user || !user.username) location.href="/index.html";
    document.getElementById("operarioLabel").innerText = user.username;
  });
  document.addEventListener("DOMContentLoaded", () => {   
    cargarUbicaciones();
  });

    let listaMatriculas = [];

    async function cargarUbicaciones() {
        const r = await fetch(`/api/ubicaciones/`);
        const ubicaciones = await r.json();

        const sel = document.getElementById("ubicacion");
        sel.innerHTML = "";

        ubicaciones.forEach(u => {
          const opt = document.createElement("option");
          opt.value = u.ubicacion;
          opt.textContent = u.ubicacion;
          sel.appendChild(opt);
        });

        // Cargar máquinas de la primera ubicación automáticamente
        if (ubicaciones.length > 0) {
          cargarTiposPorUbicacion( ubicaciones[0].ubicacion);
        }
      
    }

    async function cargarTiposPorUbicacion(ubicacion) {
        const r = await fetch(`/api/tipos/${ubicacion}`);
        const tipos = await r.json();

        const sel = document.getElementById("tipo_vehiculo");
        sel.innerHTML = "";

        tipos.forEach(m => {
          const opt = document.createElement("option");
          opt.value = m.tipo_vehiculo;
          opt.textContent = `${m.tipo_vehiculo}`;
          //opt.textContent = `${m.matricula} - ${m.tipo_vehiculo}`;
          sel.appendChild(opt);
        });

        if (tipos.length > 0) {
          cargarMatriculasPorTipo( tipos[0].tipo_vehiculo);
        }  
    }

    async function cargarMatriculasPorTipo(tipo_vehiculo) {

        const r =
            await fetch(`/api/matriculas/${tipo_vehiculo}`);

        listaMatriculas =
            await r.json();
    }

    document.getElementById("ubicacion").addEventListener("change", () => {
        const ubicacion = document.getElementById("ubicacion").value;
        cargarTiposPorUbicacion(ubicacion);
    });

    document.getElementById("tipo_vehiculo").addEventListener("change", () => {
        const tipo_vehiculo = document.getElementById("tipo_vehiculo").value;
        cargarMatriculasPorTipo(tipo_vehiculo);
    });
// BUSCAR INFORMES
async function buscarInformes() {
  const matricula = document.getElementById("matricula").value.trim();
  const fechaInicio = document.getElementById("fechaInicio").value;
  const fechaFin = document.getElementById("fechaFin").value;
  const tipo = document.getElementById("tipo").value;

  const params = new URLSearchParams();
  if (matricula) params.append("matricula", matricula);
  if (fechaInicio) params.append("fechaInicio", fechaInicio);
  if (fechaFin) params.append("fechaFin", fechaFin);
  if (tipo) params.append("tipo", tipo);

  const res = await fetch(`/api/informes?${params.toString()}`);
  if (!res.ok) {
    document.getElementById("resultados").innerHTML = "<p>Error cargando informes</p>";
    return;
  }

  const datos = await res.json();
  mostrarTabla(datos);
}

document.getElementById("btnBuscar").addEventListener("click", buscarInformes);

// MOSTRAR TABLA
function mostrarTabla(datos) {
  if (datos.length === 0) {
    document.getElementById("resultados").innerHTML = "<p>No hay informes para los filtros seleccionados.</p>";
    return;
  }

  let html = "<table><tr>";
  html += "<th>ID</th><th>Matricula</th><th>Fecha</th><th>Tipo</th><th>Descargar</th>";
  html += "</tr>";

  datos.forEach(row => {
    html += "<tr>";
    html += `<td>${row.id}</td>`;
    html += `<td>${row.matricula}</td>`;
    html += `<td>${row.fecha.slice(0,10)}</td>`;
    html += `<td>${row.tipo}</td>`;
    html += `<td><button onclick="descargar(${row.id})">Descargar</button></td>`;
    html += "</tr>";
  });

  html += "</table>";
  document.getElementById("resultados").innerHTML = html;
}


    const matriculaInput = document.getElementById("matricula");

    const divSugMatricula = document.getElementById("sugerenciasMatricula");

matriculaInput.addEventListener("input", () => {

    const texto =
        matriculaInput.value
            .trim()
            .toUpperCase();

    if (!texto) {
        divSugMatricula.style.display = "none";
        return;
    }

    const filtradas =
      listaMatriculas
        .filter(m =>
            m.matricula
              .toUpperCase()
              .includes(texto)
        )
        .slice(0,20);

    if (filtradas.length === 0) {

        divSugMatricula.style.display = "none";
        return;
    }

    divSugMatricula.innerHTML =
      filtradas
        .map(m => `
        <div
          class="mat-item"
          data-value="${m.matricula}"
          style="
            padding:8px;
            cursor:pointer;">
          ${m.matricula}
        </div>
        `)
        .join("");

    divSugMatricula.style.display = "block";
});

    divSugMatricula.addEventListener("click", e => {

        if (
            e.target.classList.contains("mat-item")
        ) {

            matriculaInput.value =
                e.target.dataset.value;

            divSugMatricula.style.display =
                "none";

            matriculaInput.dispatchEvent(
                new Event("blur")
            );
        }
    });




// DESCARGAR INFORME
function descargar(id) {
  window.location.href = `/api/informe/${id}`;
}
</script>

</body>
</html>
